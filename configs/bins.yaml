unit: m
sign_convention: negative_inside_positive_outside

# Exact target distances, not intervals. The generator samples one bearing per
# building and solves along that ray until the requested signed edge distance
# is reached.
fixed_levels_m:
    inside: [-5, -3, -1]
    outside: [1, 3, 5, 10, 20, 40, 80]
target_tolerance_m: 0.1

bearing:
    origin: point_on_surface_anchor
    distribution: uniform
    range_radians: [0.0, 6.283185307179586]
    one_per_building: true
    shared_across_levels: true

unreachable_inside:
    policy: record_unavailable
    clamp: false
    resample_bearing: false

# This gives every building one strong positive control without pretending
# that different buildings share the same deep-interior distance.
deep_inside_control:
    enabled: true
    method: maximum_inscribed_circle_center
    record_actual_signed_distance: true
    include_in_distance_curve: false
    analysis_role: control_only
