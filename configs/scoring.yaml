# human reference accuracy on the 195 analysed RQ1 pins (gold/human_on_roof.jsonl)
tau: 0.928
reliability_boundary: |
  For each model, compute the weighted accuracy (TNR) of each outside primary bin
  b in {3, 5, 10, 20, 40, 80} and its lower 95% bound LCB_b
  (2.5% percentile over the same B = 10,000 paired box draws).
  b* = the smallest b such that LCB_b' >= tau for every b' >= b.
  If LCB_80 < tau, b* = "not reached". tau = 0.928.
  Inside bins (-5, -3): no boundary, report accuracy only. Descriptive, not in the Holm family.
# task 2 pass condition: 97.5% percentile of the weighted median log error (same draws, same weights) < best-constant baseline
