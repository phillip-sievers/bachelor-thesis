[project]
name = "thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Phillip Sievers", email = "phillip.sievers@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "cairosvg>=2.9.0",
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "google-genai>=2.22.0",
    "matplotlib>=3.11.1",
    "openai>=3.8.0",
    "planetary-computer>=1.0.0",
    "pyarrow>=25.0.1",
    "pycairo>=1.29.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.1",
]

[project.scripts]
thesis = "thesis:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[pytest]
markers = [
    "network: marker for tesst that go trhoug the web",
]
