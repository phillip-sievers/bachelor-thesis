freeze_date: "2026-09-04"
pricing_basis:
    image_px: 512
    currency: USD
    as_of: "2026-09-04"

models:
    - provider: openai
      model: gpt-5.6-sol
      parameters:
          detail: original
          reasoning: { effort: low }
      image_tokens_512: 308
      image_token_count_kind: estimate
      pricing_usd_per_million_tokens:
          standard: { input: 4.0, output: 20.0 }
          batch: { input: 2.0, output: 10.0 }
      image_input_usd_per_call:
          standard: 0.001232
          batch: 0.000616
      promotional_price_through_at_least: "2026-11-21"

    - provider: anthropic
      model: claude-opus-5
      parameters:
          thinking: { type: adaptive }
          output_config: { effort: low }
      image_tokens_512: 361
      image_token_count_kind: exact
      pricing_usd_per_million_tokens:
          standard: { input: 5.0, output: 25.0 }
          batch: { input: 2.5, output: 12.5 }
      image_input_usd_per_call:
          standard: 0.001805
          batch: 0.0009025

    - provider: google
      model: gemini-3.6-flash
      parameters:
          media_resolution: high
          thinking_config: { thinking_level: low }
      image_tokens_512: 1120
      image_token_count_kind: upper_bound
      pricing_usd_per_million_tokens:
          standard: { input: 0.75, output: 3.75 }
          batch: { input: 0.375, output: 1.875 }
      image_input_usd_per_call:
          standard: 0.000840
          batch: 0.000420
      promotional_price_through: "2026-12-31"
